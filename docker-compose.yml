services:
  postgres:
    image: postgres:15
    container_name: crawler_postgres
    restart: always
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler
      POSTGRES_DB: crawler_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: crawler_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: crawler_backend
    restart: always
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    environment:
      - ENV_FILE_PATH=/app/.env.root
      - CRAWLER_WORKER_ENABLED=1
    volumes:
      - ./backend:/app
      - ./.env:/app/.env.root
      - rendered_snapshots:/app/data/rendered_snapshots
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build: ./backend
    container_name: crawler_worker
    restart: always
    command: sh -c "python -m app.worker.crawler_worker"
    env_file:
      - .env
    environment:
      - ENV_FILE_PATH=/app/.env.root
      - CRAWLER_WORKER_ENABLED=1
      - CRAWLER_WORKER_POLL_SECONDS=${CRAWLER_WORKER_POLL_SECONDS:-2}
      - CRAWLER_WORKER_TICK_LIMIT=${CRAWLER_WORKER_TICK_LIMIT:-0}
      - CRAWLER_SCHEDULES_ENABLED=${CRAWLER_SCHEDULES_ENABLED:-true}
      - CRAWLER_SCHEDULE_POLL_SECONDS=${CRAWLER_SCHEDULE_POLL_SECONDS:-30}
    volumes:
      - ./backend:/app
      - ./.env:/app/.env.root
      - rendered_snapshots:/app/data/rendered_snapshots
    depends_on:
      - postgres
      - redis
      - backend

  frontend:
    build: ./frontend
    container_name: crawler_frontend
    restart: always
    command: sh -c "npm install && rm -rf node_modules/.vite && npm run dev -- --host 0.0.0.0 --force"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_ADMIN_EMAILS=${ADMIN_EMAILS}
      - VITE_API_BASE=${VITE_API_BASE:-http://localhost:8000}
      - VITE_PROMETHEUS_UI_URL=${VITE_PROMETHEUS_UI_URL:-http://localhost:9090}
      - VITE_ENABLE_UI_DEBUG=${VITE_ENABLE_UI_DEBUG:-false}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: crawler_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
  prometheus_data:
  rendered_snapshots:
