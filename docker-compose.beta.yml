services:
  postgres:
    image: postgres:15
    container_name: crawler_beta_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crawler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-crawler_db}
    volumes:
      - postgres_beta_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crawler} -d ${POSTGRES_DB:-crawler_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: crawler_beta_redis
    restart: always
    volumes:
      - redis_beta_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.beta
    container_name: crawler_beta_backend
    restart: always
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - ${BETA_ENV_FILE:-.env.beta}
    environment:
      ENV_FILE_PATH: /app/.env.root
      CRAWLER_WORKER_ENABLED: "1"
    volumes:
      - ./${BETA_ENV_FILE:-.env.beta}:/app/.env.root
      - rendered_beta_snapshots:/app/data/rendered_snapshots
    ports:
      - "${BACKEND_BIND:-127.0.0.1:8003}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.beta
    container_name: crawler_beta_worker
    restart: always
    command: sh -c "python -m app.worker.crawler_worker"
    env_file:
      - ${BETA_ENV_FILE:-.env.beta}
    environment:
      ENV_FILE_PATH: /app/.env.root
      CRAWLER_WORKER_ENABLED: "1"
      CRAWLER_WORKER_POLL_SECONDS: ${CRAWLER_WORKER_POLL_SECONDS:-2}
      CRAWLER_WORKER_TICK_LIMIT: ${CRAWLER_WORKER_TICK_LIMIT:-0}
      CRAWLER_SCHEDULES_ENABLED: ${CRAWLER_SCHEDULES_ENABLED:-true}
      CRAWLER_SCHEDULE_POLL_SECONDS: ${CRAWLER_SCHEDULE_POLL_SECONDS:-30}
    volumes:
      - ./${BETA_ENV_FILE:-.env.beta}:/app/.env.root
      - rendered_beta_snapshots:/app/data/rendered_snapshots
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.beta
      args:
        VITE_API_BASE: /api
        VITE_ADMIN_PASSWORD_LOGIN_ENABLED: ${VITE_ADMIN_PASSWORD_LOGIN_ENABLED:-true}
        VITE_PASSWORD_LOGIN_ENABLED: ${VITE_PASSWORD_LOGIN_ENABLED:-true}
        VITE_ENABLE_UI_DEBUG: ${VITE_ENABLE_UI_DEBUG:-false}
        VITE_PROMETHEUS_UI_URL: ""
    container_name: crawler_beta_frontend
    restart: always
    ports:
      - "${FRONTEND_BIND:-127.0.0.1:8002}:80"
    depends_on:
      backend:
        condition: service_started

  caddy:
    profiles:
      - caddy
    image: caddy:2
    container_name: crawler_beta_caddy
    restart: always
    env_file:
      - ${BETA_ENV_FILE:-.env.beta}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/beta/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_beta_data:/data
      - caddy_beta_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started

volumes:
  postgres_beta_data:
  redis_beta_data:
  rendered_beta_snapshots:
  caddy_beta_data:
  caddy_beta_config:
